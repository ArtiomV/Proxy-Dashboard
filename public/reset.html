<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arendaproxy — новый пароль</title>
  <link rel="icon" type="image/png" href="/img/brand-favicon-96.png" sizes="96x96">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/brand-apple-touch.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/variables.css?v=0813c">
  <link rel="stylesheet" href="/css/base.css?v=0813c">
  <link rel="stylesheet" href="/css/client-portal.css?v=0813d">
  <style>
    .login-box{background:var(--bg-2);border:1px solid var(--border);border-radius:20px;padding:48px 40px;width:420px;max-width:90vw;box-shadow:0 24px 64px rgba(0,0,0,.5)}
    .login-links{margin-top:16px;text-align:center;font-size:13px;color:#B3B3B3}
    .login-links a{color:#1960C9;text-decoration:none}
    .login-links a:hover{text-decoration:underline}
    .auth-note{text-align:center;font-size:13px;color:#34C759;margin-bottom:12px;min-height:18px;line-height:1.5}
  </style>
</head>
<body>

  <div class="login-overlay">
    <div class="login-box">
      <div class="login-logo"><img src="/img/brand-logo.webp" alt="Arendaproxy"><span>Arendaproxy</span></div>
      <p class="login-sub">Новый пароль</p>
      <div class="login-error" id="rsError"></div>
      <div class="auth-note" id="rsNote"></div>

      <div id="rsForm">
        <input type="password" id="rsPassword" placeholder="Новый пароль (минимум 8 символов)" autocomplete="new-password">
        <input type="password" id="rsPassword2" placeholder="Повторите пароль" autocomplete="new-password">
        <button class="btn-login" id="btnReset" data-on-click="doReset()">Сохранить пароль</button>
      </div>
      <div class="login-links"><a href="/">← На страницу входа</a></div>
    </div>
  </div>

<script src="/js/delegation.js?v=0813c"></script>
<script>
var _token=new URLSearchParams(window.location.search).get('token')||'';
if(!_token){
  document.getElementById('rsForm').style.display='none';
  document.getElementById('rsError').textContent='Ссылка недействительна — нет токена';
}else{
  document.getElementById('rsPassword').focus();
}

async function doReset(){
  var err=document.getElementById('rsError');
  var note=document.getElementById('rsNote');
  var btn=document.getElementById('btnReset');
  err.textContent='';note.textContent='';
  var p1=document.getElementById('rsPassword').value;
  var p2=document.getElementById('rsPassword2').value;
  if(p1.length<8){err.textContent='Пароль — минимум 8 символов';return}
  if(p1!==p2){err.textContent='Пароли не совпадают';return}
  btn.disabled=true;
  try{
    var resp=await fetch('/api/reset_password',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token:_token,password:p1})
    });
    var data=await resp.json();
    if(!resp.ok){err.textContent=data.error||'Ошибка сброса';return}
    document.getElementById('rsForm').style.display='none';
    note.textContent='Пароль сохранён. Перенаправляем на страницу входа…';
    setTimeout(function(){window.location.href='/'},1500);
  }catch(e){
    err.textContent='Ошибка соединения';
  }finally{
    btn.disabled=false;
  }
}

document.getElementById('rsPassword2').addEventListener('keydown',function(e){if(e.key==='Enter')doReset()});
</script>

</body>
</html>
