<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arendaproxy — регистрация</title>
  <link rel="icon" type="image/png" href="/img/brand-favicon-96.png" sizes="96x96">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/brand-apple-touch.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/variables.css?v=0813c">
  <link rel="stylesheet" href="/css/base.css?v=0813c">
  <link rel="stylesheet" href="/css/client-portal.css?v=0814a">
  <style>
    /* client-portal.css гасит карточку .login-box (там split-лейаут) — на
       standalone auth-страницах карточку возвращаем, фирменный канвас остаётся */
    .login-box{background:var(--bg-2);border:1px solid var(--border);border-radius:20px;padding:48px 40px;width:420px;max-width:90vw;box-shadow:0 24px 64px rgba(0,0,0,.5)}
    /* Мелочи специфичные для auth-страниц; общий каркас — base.css (.login-*) */
    .login-links{margin-top:16px;text-align:center;font-size:13px;color:#B3B3B3}
    .login-links a{color:#1960C9;text-decoration:none}
    .login-links a:hover{text-decoration:underline}
    .consent-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:14px;font-size:12px;color:#B3B3B3;line-height:1.5}
    .consent-row input{width:auto!important;margin:2px 0 0!important;padding:0!important}
    .auth-note{text-align:center;font-size:13px;color:#34C759;margin-bottom:12px;min-height:18px}
    .tg-wrap{display:flex;justify-content:center;margin:6px 0 14px;min-height:0}
    .tg-wrap:empty{display:none}
    .cf-turnstile{margin-bottom:14px}

    /* Пустые заглушки ошибки/нотиса не занимают место (был «пустой» зазор под заголовком) */
    .login-error:empty,.auth-note:empty{display:none}
  </style>
</head>
<body>

  <div class="login-overlay">
    <div class="login-box">
      <div class="login-logo"><img src="/img/brand-logo.webp" alt="Arendaproxy"><span>Arendaproxy</span></div>
      <p class="login-sub">Регистрация</p>
      <div class="login-error" id="regError"></div>
      <div class="auth-note" id="regNote"></div>

      <div id="regForm" style="display:none">
        <input type="email" id="regEmail" placeholder="Email" autocomplete="email">
        <input type="password" id="regPassword" placeholder="Пароль (минимум 8 символов)" autocomplete="new-password">
        <!-- Honeypot: невидимо для людей, боты заполняют — сервер молча вернёт ok -->
        <input type="text" name="website" id="regWebsite" style="display:none" autocomplete="off" tabindex="-1" aria-hidden="true">
        <label class="consent-row">
          <input type="checkbox" id="regConsent">
          <span>Соглашаюсь с условиями оферты и даю согласие на обработку персональных данных</span>
        </label>
        <div id="turnstileWrap"></div>
        <button class="btn-login" id="btnRegister" data-on-click="doRegister()">Зарегистрироваться</button>
        <div class="tg-wrap" id="tgWrap"></div>
        <div class="login-links">Уже есть аккаунт? <a href="/">Войти</a></div>
      </div>

      <div id="regClosed" style="display:none;text-align:center;color:#B3B3B3;font-size:14px;line-height:1.6">
        Регистрация закрыта.<br>Для подключения обратитесь к менеджеру.
        <div class="login-links"><a href="/">← На страницу входа</a></div>
      </div>
    </div>
  </div>

<script src="/js/delegation.js?v=0813c"></script>
<script src="/js/auth/register.js?v=0814b"></script>

</body>
</html>
