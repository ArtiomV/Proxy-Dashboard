<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arendaproxy — подтверждение email</title>
  <link rel="icon" type="image/png" href="/img/brand-favicon-96.png" sizes="96x96">

    .login-box{background:var(--bg-2);border:1px solid var(--border);border-radius:20px;padding:48px 40px;width:420px;max-width:90vw;box-shadow:0 24px 64px rgba(0,0,0,.5)}

      <a class="btn-login" id="vfBtn" href="/" style="display:none;text-align:center;text-decoration:none;line-height:1.4;padding:14px">Перейти ко входу</a>
      <div class="login-links"><a href="/">← На страницу входа</a></div>
    </div>
  </div>

<script src="/js/auth/verify.js?v=0814a"></script>
